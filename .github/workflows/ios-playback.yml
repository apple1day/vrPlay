name: Independent iOS decoder reference
on: [push]
permissions:
  contents: read
jobs:
  decode:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Read the same AVC samples on iOS Simulator without VRPlay
        run: |
          set -eu
          sim="$(xcrun simctl list devices available -j | python3 -c 'import sys,json; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for r,ds in devices.items() if "iOS-" in r for d in ds if d["name"].startswith("iPhone")))')"
          xcrun simctl boot "$sim"
          sdk="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          xcrun --sdk iphonesimulator swiftc -sdk "$sdk" -target "$(uname -m)-apple-ios16.0-simulator" Tests/Metadata/AVCPixels.swift -o "$RUNNER_TEMP/probe"
          codesign -s - -f "$RUNNER_TEMP/probe"
          xcrun simctl bootstatus "$sim" -b
          for name in VRPlaySmoke_360_LR VRPlayColor_360_LR; do
            echo "$name"
            xcrun simctl spawn "$sim" "$RUNNER_TEMP/probe" "$PWD/Tests/Fixtures/$name.mp4"
          done
