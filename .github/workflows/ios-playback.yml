name: iOS playback regression
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  playback:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Prepare XcodeGen and Metal compiler
        run: |
          command -v xcodegen || brew install xcodegen
          xcrun -sdk iphonesimulator metal --version || xcodebuild -downloadComponent MetalToolchain
      - name: Check metadata after a 4 GiB media box
        run: |
          xcrun swiftc VRPlay/Model/VRSettings.swift VRPlay/Model/FormatDetector.swift Tests/Metadata/main.swift -o "$RUNNER_TEMP/metadata-test"
          "$RUNNER_TEMP/metadata-test"
      - name: Build and test playback on iPhone Simulator
        run: bash scripts/test-playback.sh
        env:
          RESULT_BUNDLE_PATH: Playback.xcresult
      - name: Save test results and failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playback-results
          path: Playback.xcresult
          if-no-files-found: ignore
