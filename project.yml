name: VRPlay
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "2"
targets:
  VRPlay:
    type: application
    platform: iOS
    sources:
      - VRPlay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.vrplay
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: VRPlay/Info.plist
      properties:
        CFBundleDisplayName: VRPlay
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSMotionUsageDescription: 用于 VR 模式下的头部追踪（陀螺仪）
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsForMedia: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  VRPlayUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/UITests
      - path: Tests/Fixtures/VRPlaySmoke_360_LR.mp4
        buildPhase: resources
    dependencies:
      - target: VRPlay
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.vrplay.uitests
schemes:
  VRPlay:
    build:
      targets:
        VRPlay: all
    test:
      targets: [VRPlayUITests]
